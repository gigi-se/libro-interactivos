<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ejercicio didáctico 1 — Permutaciones</title>
<style>
  :root { --principal:#007285; --fondo:#f0fcff; --texto:#1b1b1b; --reto:#E65100; --gris:#5c5c5c; }
  * { box-sizing:border-box; }
  body { margin:0; font-family:Helvetica,Arial,sans-serif; color:var(--texto); background:#fff; line-height:1.45; }
  header { background:var(--principal); color:#fff; padding:14px 18px; }
  header small { opacity:.85; letter-spacing:.06em; text-transform:uppercase; }
  header h1 { margin:2px 0 0; font-size:1.3rem; }
  main { max-width:640px; margin:0 auto; padding:14px 16px 36px; }
  .intro { margin:6px 0 10px; }
  .caja { background:var(--fondo); border-top:3px solid var(--principal); border-bottom:3px solid var(--principal); padding:10px 12px; margin:10px 0; }
  svg { width:100%; height:auto; max-height:300px; display:block; }
  .etq { font-size:12px; fill:var(--gris); }
  .ficha circle { fill:#e6f6f9; stroke:var(--principal); stroke-width:1.6; }
  .ficha text { font-size:13px; font-weight:bold; fill:var(--texto); text-anchor:middle; }
  .ficha { transition: transform .7s ease, opacity .4s; }
  .hueco { fill:#fff; stroke:var(--principal); stroke-width:1.5; stroke-dasharray:3 3; opacity:.45; }
  .formula { text-align:center; font-family:Georgia,'Times New Roman',serif; font-size:1.15rem; margin:6px 0; }
  .nota { text-align:center; color:var(--gris); font-size:.92rem; margin:4px 0 8px; min-height:2.6em; }
  .ctl { display:grid; grid-template-columns:90px 34px 1fr; align-items:center; gap:8px; margin:8px 0; }
  .ctl b { color:var(--principal); }
  .ctl output { text-align:right; font-weight:bold; }
  input[type=range] { width:100%; accent-color:var(--principal); }
  .botones { display:flex; gap:8px; flex-wrap:wrap; margin-top:8px; }
  button { background:var(--reto); color:#fff; border:0; border-radius:6px; padding:9px 14px; font-size:.95rem; cursor:pointer; }
  button.sec { background:#fff; color:var(--principal); border:2px solid var(--principal); }
  .conteo { font-size:.95rem; }
  .conteo strong { color:var(--principal); }
  footer { font-size:.8rem; color:#666; text-align:center; padding:10px; }
</style>
</head>
<body>
<header><small>Mat. discreta · Ejercicio 1</small><h1>Permutaciones: el orden importa</h1></header>
<main>
  <p class="intro">Cambia el número de opciones y de extracciones. Observa cómo se construye un ordenamiento y cuántos distintos existen.</p>

  <div class="caja">
    <svg id="lienzo" viewBox="0 0 360 230" role="img" aria-label="Animación de una permutación"></svg>
    <div class="formula" id="formula"></div>
    <div class="nota" id="nota"></div>
  </div>

  <div class="ctl"><b>Opciones</b><output id="vn">6</output><input type="range" id="n" min="4" max="8" value="6" aria-label="Número de opciones"></div>
  <div class="ctl"><b>Extracciones</b><output id="vr">3</output><input type="range" id="r" min="2" max="5" value="3" aria-label="Número de extracciones"></div>

  <p class="conteo" id="conteo"></p>

  <div class="botones">
    <button id="otra">Otro ordenamiento</button>
    <button id="pausa" class="sec">Pausar</button>
  </div>
</main>
<footer>Libro de Matemática · actividad interactiva</footer>

<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.getElementById('lienzo');
  var inN = document.getElementById('n'), inR = document.getElementById('r');
  var timers = [], pausado = false, bucle = null;

  function fact(k) { var f = 1; for (var i = 2; i <= k; i++) f *= i; return f; }
  function fmt(x) { return x.toLocaleString('es'); }
  function el(tag, attrs, parent) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (parent) parent.appendChild(e);
    return e;
  }
  function limpiar() { timers.forEach(clearTimeout); timers = []; clearTimeout(bucle); }
  function mezclar(a) {
    for (var i = a.length - 1; i > 0; i--) { var j = Math.floor(Math.random() * (i + 1)); var t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function pos(i, total) { var margen = 24, ancho = 360 - 2 * margen; return total === 1 ? 180 : margen + i * ancho / (total - 1); }

  function textos(N, R) {
    var p = fact(N) / fact(N - R);
    document.getElementById('vn').textContent = N;
    document.getElementById('vr').textContent = R;
    document.getElementById('formula').textContent = 'P(' + N + ', ' + R + ') = ' + N + '! / (' + N + ' − ' + R + ')! = ' + fmt(p);
    var fac = [];
    for (var i = 0; i < R; i++) fac.push(N - i);
    document.getElementById('conteo').innerHTML =
      'Por el principio multiplicativo: ' + fac.join(' · ') + ' = <strong>' + fmt(p) + '</strong> ordenamientos distintos.';
  }

  function correr() {
    limpiar();
    var N = +inN.value, R = +inR.value;
    if (R > N) { R = N; inR.value = R; }
    textos(N, R);
    document.getElementById('nota').textContent = 'Se están tomando fichas una por una, sin devolverlas.';
    while (svg.firstChild) svg.removeChild(svg.firstChild);

    el('text', { x: 180, y: 18, 'text-anchor': 'middle', 'class': 'etq' }, svg).textContent = 'Fichas disponibles';
    el('text', { x: 180, y: 140, 'text-anchor': 'middle', 'class': 'etq' }, svg).textContent = 'Ordenamiento';

    var fichas = [], k, g;
    for (k = 0; k < N; k++) {
      el('circle', { cx: pos(k, N), cy: 62, r: 15, 'class': 'hueco' }, svg);
    }
    for (k = 0; k < R; k++) {
      el('circle', { cx: pos(k, R), cy: 190, r: 15, 'class': 'hueco' }, svg);
    }
    for (k = 0; k < N; k++) {
      g = el('g', { 'class': 'ficha' }, svg);
      g.style.transform = 'translate(' + pos(k, N) + 'px,62px)';
      el('circle', { r: 15 }, g);
      el('text', { y: 4 }, g).textContent = k + 1;
      fichas.push(g);
    }

    var orden = mezclar(fichas.map(function (_, i) { return i; })).slice(0, R);
    var elegidas = [];
    orden.forEach(function (idx, paso) {
      timers.push(setTimeout(function () {
        if (pausado) { return; }
        fichas[idx].style.transform = 'translate(' + pos(paso, R) + 'px,190px)';
        fichas[idx].style.fill = '';
        elegidas.push(idx + 1);
        if (paso === R - 1) {
          document.getElementById('nota').textContent =
            'Este ordenamiento es ' + elegidas.join(', ') + '. Las mismas fichas en otro orden forman otra permutación.';
        }
      }, 700 + paso * 1000));
    });
    bucle = setTimeout(function () { if (!pausado) correr(); }, 700 + R * 1000 + 3500);
  }

  inN.oninput = function () { if (+inR.value > +inN.value) inR.value = inN.value; correr(); };
  inR.oninput = correr;
  document.getElementById('otra').onclick = function () { pausado = false; document.getElementById('pausa').textContent = 'Pausar'; correr(); };
  document.getElementById('pausa').onclick = function () {
    pausado = !pausado;
    this.textContent = pausado ? 'Reanudar' : 'Pausar';
    if (!pausado) correr();
  };
  correr();
})();
</script>
</body>
</html>
