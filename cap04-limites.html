<!DOCTYPE html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Límites: acercándose a un valor</title><style>
*{box-sizing:border-box}body{margin:0;font-family:Arial,Helvetica,sans-serif;color:#111;background:#fff}
header{background:#00738A;padding:24px 27px 22px}header small{display:block;color:#bfe3ea;font-size:18px;letter-spacing:.5px;text-transform:uppercase}
header h1{margin:8px 0 0;color:#fff;font-size:30px}main{max-width:912px;margin:34px auto;padding:0 14px}
p.i{font-size:19px;line-height:1.55;margin:0 0 26px}.panel{border-top:4px solid #00738A;background:#F0FBFE;padding:22px}
canvas{width:100%;background:transparent;display:block}.ctl{display:flex;flex-wrap:wrap;gap:18px;margin-top:14px;align-items:center;font-size:16px}
.ctl label{display:flex;flex-direction:column;gap:4px;min-width:200px;flex:1}.ctl select{padding:6px;font-size:15px}input[type=range]{accent-color:#E65100}
.f{font-family:Georgia,serif;font-size:24px;text-align:center;margin:16px 0 4px}.note{text-align:center;color:#555;font-size:15px;line-height:1.5}
.ok{color:#E65100}h2{font-size:22px;color:#00738A;margin:34px 0 8px}.ex{background:#F0FBFE;border-left:4px solid #E65100;padding:12px 16px;margin:12px 0;font-size:17px}
.ex input{width:120px;padding:6px;font-size:16px;margin:0 8px;border:1px solid #9bbcc4;border-radius:4px}.ex button{background:#00738A;color:#fff;border:0;padding:7px 14px;border-radius:4px;font-size:15px;cursor:pointer}
.g{color:#2e7d32;font-weight:700}.b{color:#c62828;font-weight:700}#sc{font-size:17px;margin:6px 0}
</style></head><body><header><small>CÁLCULO · EJERCICIO 1</small><h1>Límites: acercándose a un valor</h1></header><main>
<p class="i">Elige una función y reduce la distancia δ. Los puntos naranjas se acercan a a por ambos lados; el círculo vacío marca el valor que la función no necesita tomar.</p><div class="panel"><canvas id="cv" width="860" height="380"></canvas><div class="ctl"><label>Función<select id="sel"><option>(x²−4)/(x−2), a = 2</option><option>(x³−1)/(x−1), a = 1</option><option>sen(x)/x, a = 0</option></select></label><label>Distancia δ = <span id="vd"></span><input type="range" id="d" min="0.01" max="1" step="0.01" value="0.6"></label></div>
<div class="f" id="fo"></div><div class="note" id="no"></div></div>
<h2>Ejercicios autocorregidos</h2><div id="sc">Aciertos: <b id="nn">0</b> de 5</div><div id="exs"></div>
<script>
const $=i=>document.getElementById(i),O="#E65100",TL="#00738A",cv=$("cv"),c=cv.getContext("2d"),W=cv.width,H=cv.height;
let X,Y;function frame(x0,x1,y0,y1){X=x=>(x-x0)/(x1-x0)*W;Y=y=>H-(y-y0)/(y1-y0)*H;c.clearRect(0,0,W,H);c.strokeStyle="#c5dde2";c.lineWidth=1;c.beginPath();
 if(y0<0&&y1>0){c.moveTo(0,Y(0));c.lineTo(W,Y(0))}if(x0<0&&x1>0){c.moveTo(X(0),0);c.lineTo(X(0),H)}c.stroke()}
function curve(f,x0,x1,col,w){c.strokeStyle=col||TL;c.lineWidth=w||3;c.beginPath();let on=0;for(let i=0;i<=400;i++){const x=x0+(x1-x0)*i/400,y=f(x);
 if(isFinite(y)&&Math.abs(Y(y))<3*H){on?c.lineTo(X(x),Y(y)):c.moveTo(X(x),Y(y));on=1}else on=0}c.stroke()}
function node(x,y,fill,r){c.fillStyle=fill?"#FDF0E6":"#fff";c.strokeStyle=O;c.lineWidth=3;c.beginPath();c.arc(X(x),Y(y),r||9,0,7);c.fill();c.stroke()}
function line(a,b,d,e,col,w,dash){c.strokeStyle=col;c.lineWidth=w||2;c.setLineDash(dash||[]);c.beginPath();c.moveTo(X(a),Y(b));c.lineTo(X(d),Y(e));c.stroke();c.setLineDash([])}
const fx=(v,k)=>(+v).toFixed(k===undefined?3:k);
const FS=[{f:x=>(x*x-4)/(x-2),a:2,L:4,r:[-1,5,-1,7]},{f:x=>(x**3-1)/(x-1),a:1,L:3,r:[-1,3,-1,8]},{f:x=>Math.sin(x)/x,a:0,L:1,r:[-6,6,-.5,1.4]}];
function draw(){const F=FS[$("sel").value],d=+$("d").value;$("vd").textContent=fx(d,2);frame(...F.r);curve(F.f,F.r[0],F.r[1]);
 node(F.a,F.L,0,10);node(F.a-d,F.f(F.a-d),1);node(F.a+d,F.f(F.a+d),1);
 $("fo").innerHTML="f("+fx(F.a-d,2)+") = <span class=ok>"+fx(F.f(F.a-d))+"</span> &nbsp;&nbsp; f("+fx(F.a+d,2)+") = <span class=ok>"+fx(F.f(F.a+d))+"</span>";
 $("no").textContent="Ambos lados se acercan a L = "+F.L+" cuando δ → 0, aunque f(a) no esté definida.";}
$("sel").onchange=$("d").oninput=draw;draw();
const EX=[["lim x→3 (x²−9)/(x−3) =", 6], ["lim x→∞ (4x²+1)/(2x²−x) =", 2], ["lim x→0 sen(5x)/x =", 5], ["lim x→0 (√(x+9)−3)/x = (2 decimales)", 0.16666666666666666], ["¿Qué valor de k hace continua f en x=1 si f(x)=(x²−1)/(x−1) para x≠1 y f(1)=k?", 2]];let hit=new Set();
EX.forEach((e,i)=>{const d=document.createElement("div");d.className="ex";d.innerHTML=(i+1)+") "+e[0]+' <input type="number" step="any"><button>Comprobar</button> <span></span>';
 d.querySelector("button").onclick=()=>{const v=parseFloat(d.querySelector("input").value),ok=Math.abs(v-e[1])<0.011,s=d.querySelector("span");
 s.className=ok?"g":"b";s.textContent=ok?"✔ ¡Correcto!":"✘ Revisa y vuelve a intentar";if(ok)hit.add(i);$("nn").textContent=hit.size};$("exs").appendChild(d)});
</script></main></body></html>
